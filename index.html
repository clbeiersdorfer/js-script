<!DOCTYPE html>
<html>
<body>

<div id="ball"></div>

<style>
#ball {
    width: 50px;
    height: 50px;
    background: red;
    border-radius: 50%;
    position: absolute;
}
</style>

<script>
let nameObj = "Ball";  // String
let speed = 1;      // Number
let moving = true;  // Boolean

let x = 100;
let y = 100;

let dx = speed;
let dy = speed;

// Self made function
function moveBall() {
    if (moving) {
        x += dx;
        y += dy;

        if (x > window.innerWidth - 50 || x < 0) {
            dx = -dx;
        }

        if (y > window.innerHeight - 50 || y < 0) {
            dy = -dy;
        }

        ball.style.left = x + "px";
        ball.style.top = y + "px";
    }
}

// console.log
function showInfo() {
    console.log(nameObj, speed, moving);
}

showInfo();

setInterval(moveBall, 20);
</script>

</body>
</html>
